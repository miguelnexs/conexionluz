server {
    listen 80;
    server_name conexionluz.com www.conexionluz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name conexionluz.com www.conexionluz.com;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/conexionluz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conexionluz.com/privkey.pem;

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
    }

    location / {
        # Activar mantenimiento
        # return 503;

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}
