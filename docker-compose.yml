services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conexionluz
      POSTGRES_USER: conexionluz
      POSTGRES_PASSWORD: conexionluz_dev_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conexionluz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: conexionluz
      POSTGRES_USER: conexionluz
      POSTGRES_PASSWORD: conexionluz_dev_2024
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: "django-insecure-9dsl44r-dq-joow-4bfnt-d-s6u-d6cc7do2re0id-ka-j7y"
      DJANGO_DEBUG: "1"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  media_data:
