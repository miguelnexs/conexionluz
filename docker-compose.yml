services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conexionluz
      POSTGRES_USER: conexionluz
      POSTGRES_PASSWORD: conexionluz_dev_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conexionluz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_network

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      POSTGRES_DB: conexionluz
      POSTGRES_USER: conexionluz
      POSTGRES_PASSWORD: conexionluz_dev_2024
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: "django-insecure-9dsl44r-dq-joow-4bfnt-d-s6u-d6cc7do2re0id-ka-j7y"
      DJANGO_DEBUG: "0"
      USE_SQLITE: "0"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 3600 --max-requests 1000"
    networks:
      - db_network

  pagina:
    build: ./pagina
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - media_data:/app/media
    depends_on:
      - backend
    networks:
      db_network:

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  db_network:
